<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acerte a Senha</title>
<meta name="description" content="Jogo simples: descubra a senha secreta de 1 a 100 com dicas de maior ou menor.">
<style>
  :root{
    --laranja:#FF7A00;
    --escuro:#1a1a1a;
    --cinza:#555;
    --claro:#f7f7f7;
    --verde:#25D366;
    --vermelho:#e53935;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--escuro);
    background:linear-gradient(180deg,#fff 0%,var(--claro) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    line-height:1.5;
  }
  .caixa{
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:16px;
    padding:32px 24px;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.08);
  }
  h1{font-size:1.7rem;font-weight:800;margin-bottom:6px}
  h1 span{color:var(--laranja)}
  p.sub{color:var(--cinza);font-size:.95rem;margin-bottom:22px}

  form{display:flex;gap:8px;margin-bottom:16px}
  input[type="number"]{
    flex:1;
    font-size:1.3rem;
    font-weight:700;
    text-align:center;
    padding:12px;
    border:2px solid var(--escuro);
    border-radius:12px;
    outline:none;
  }
  input[type="number"]:focus{border-color:var(--laranja)}
  button{
    font-size:1rem;
    font-weight:800;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:var(--laranja);
    color:#fff;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}

  .dica{
    min-height:60px;
    font-size:1.15rem;
    font-weight:700;
    padding:14px;
    border-radius:12px;
    background:var(--claro);
    margin-bottom:14px;
  }
  .dica.maior{background:#fff3e6;color:#b35300}
  .dica.menor{background:#e8f1ff;color:#1d4ed8}
  .dica.acertou{background:#e6f9ee;color:#1b7a3d}
  .dica.erro{background:#fdecea;color:var(--vermelho)}

  .tentativas{font-size:.9rem;color:var(--cinza);margin-bottom:18px}
  .tentativas b{color:var(--escuro)}

  .historico{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-bottom:18px;
  }
  .historico span{
    background:#fff;border:1px solid #ddd;border-radius:999px;
    padding:3px 10px;font-size:.8rem;font-weight:600;
  }

  .reiniciar{
    background:var(--verde);
    width:100%;
    display:none;
  }
  .reiniciar.on{display:block}
</style>
</head>
<body>

<div class="caixa">
  <h1>Acerte a <span>Senha</span></h1>
  <p class="sub">Escolhi um número secreto de <b>1 a 100</b>.<br>Tente descobrir qual é!</p>

  <form id="form" autocomplete="off">
    <input type="number" id="palpite" min="1" max="100" placeholder="?" required autofocus>
    <button type="submit" id="btn">Tentar</button>
  </form>

  <div class="dica" id="dica">Digite um número e clique em Tentar.</div>

  <div class="tentativas">Tentativas: <b id="contador">0</b></div>

  <div class="historico" id="historico"></div>

  <button type="button" class="reiniciar" id="reiniciar">Jogar de novo</button>
</div>

<script>
  var senha, tentativas;
  var form = document.getElementById('form');
  var input = document.getElementById('palpite');
  var btn = document.getElementById('btn');
  var dica = document.getElementById('dica');
  var contador = document.getElementById('contador');
  var historico = document.getElementById('historico');
  var reiniciar = document.getElementById('reiniciar');

  function novoJogo(){
    senha = Math.floor(Math.random() * 100) + 1;
    tentativas = 0;
    contador.textContent = '0';
    historico.innerHTML = '';
    dica.className = 'dica';
    dica.textContent = 'Digite um número e clique em Tentar.';
    input.value = '';
    input.disabled = false;
    btn.disabled = false;
    reiniciar.classList.remove('on');
    input.focus();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var palpite = parseInt(input.value, 10);

    if (isNaN(palpite) || palpite < 1 || palpite > 100){
      dica.className = 'dica erro';
      dica.textContent = 'Digite um número entre 1 e 100.';
      return;
    }

    tentativas++;
    contador.textContent = tentativas;

    var chip = document.createElement('span');
    chip.textContent = palpite;
    historico.appendChild(chip);

    if (palpite === senha){
      dica.className = 'dica acertou';
      dica.textContent = 'Acertou! A senha era ' + senha + '. Você usou ' +
        tentativas + (tentativas === 1 ? ' tentativa.' : ' tentativas.');
      input.disabled = true;
      btn.disabled = true;
      reiniciar.classList.add('on');
      reiniciar.focus();
    } else if (palpite < senha){
      dica.className = 'dica maior';
      dica.textContent = 'A senha é MAIOR que ' + palpite + '.';
    } else {
      dica.className = 'dica menor';
      dica.textContent = 'A senha é MENOR que ' + palpite + '.';
    }

    input.value = '';
    input.focus();
  });

  reiniciar.addEventListener('click', novoJogo);

  novoJogo();
</script>

</body>
</html>
